[package]
name = "reposuite-repodex"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "RepoSuite RepoDex - deterministic, source-grounded repository analysis foundation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rceman/reposuite-repodex"
publish = false

[lib]
name = "repodex"
path = "src/lib.rs"

[[bin]]
name = "reposuite-repodex"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-php = "0.24.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4"
sha2 = "0.10.9"

[profile.release]
debug = false

[[bench]]
name = "spike"
harness = false
